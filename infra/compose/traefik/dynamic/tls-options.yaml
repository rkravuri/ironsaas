# The ingress's TLS policy (TF-074 AC3, ADR-0054): TLS 1.2 and 1.3 only, and for TLS 1.2 only forward-secret AEAD
# suites. Traefik applies the "default" options to every router that serves TLS. TLS 1.3's suites are all AEAD and are
# not configurable in Go. The smoke's tls step proves a TLS 1.0 client and a TLS 1.2 client of old suites are refused.
tls:
  options:
    default:
      minVersion: VersionTLS12
      cipherSuites:
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256
      curvePreferences:
        - X25519
        - CurveP256
        - CurveP384
