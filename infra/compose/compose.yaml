# Foundation laptop platform (ADR-0005).
# Start with `make up` (everything) or `make up-slim` (no telemetry stack); stop with `make down`.
# Credentials come from infra/compose/.env, created once by `make env`. No secret lives in this file.
# Image versions are exact (ADR-0003), each beside its digest, which Dependabot keeps current (ADR-0055); the licence
# of each image is noted on its service.

name: foundation

networks:
  foundation:
    # Tenant units (T14) are separate Compose projects; they join this network as an external network.
    name: foundation

volumes:
  postgres-data:
  blob-data:
  openbao-data:
  prometheus-data:
  loki-data:
  fleet-units:
  tempo-data:
  grafana-data:
  alertmanager-data:

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  # ---------------------------------------------------------------- ingress
  traefik:
    image: traefik:v3.7.14@sha256:575fa15b135078fe5e50aa847987d96dbddd7b093c172429618404df73f3fa7c # MIT
    command: ["--configFile=/etc/traefik/traefik.yaml"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yaml:/etc/traefik/traefik.yaml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./certs:/certs:ro
    networks:
      foundation:
        # The test identity provider's name reaches the ingress from the units too, so a unit's API, the browser and the
        # smoke all meet the provider at one address and one issuer (ADR-0048).
        aliases: [idp.localhost]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.localhost`)"
      - "traefik.http.routers.traefik.entrypoints=web,websecure"
      - "traefik.http.routers.traefik.service=api@internal"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    logging: *default-logging

  # ---------------------------------------------------------------- database
  postgres:
    # PostgreSQL licence. 19 is a release candidate until the GA planned for 2026-11-19; change the tag to 19.0 then.
    image: postgres:19rc1@sha256:b3cb7405059fd06f9ebae4aad4780b3788dfdd2acef1ac248ad9d56ced8abb06
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - max_connections=300
      - -c
      - log_min_duration_statement=250
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 18 and later images keep the data under /var/lib/postgresql/<major>/docker; mount the parent.
      - postgres-data:/var/lib/postgresql
    networks: [foundation]
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *default-logging

  # ---------------------------------------------------------------- object storage
  blob:
    # MIT. Azurite, the local stand-in for Azure Blob Storage (ADR-0006). Blob service only.
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0@sha256:830430c1da1a2d537e08f3e6764dd1f5ae00cf0346bcaf625b968ec3f0971fd5
    command:
      - azurite-blob
      - --blobHost
      - "0.0.0.0"
      - --blobPort
      - "10000"
      - --location
      - /data
      - --skipApiVersionCheck
      - --loose
    environment:
      AZURITE_ACCOUNTS: ${BLOB_ACCOUNT_NAME}:${BLOB_ACCOUNT_KEY}
    ports:
      - "10000:10000"
    volumes:
      - blob-data:/data
    networks: [foundation]
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "10000"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    logging: *default-logging

  # ---------------------------------------------------------------- secrets
  openbao:
    # MPL-2.0. Server mode with integrated storage on a named volume, unsealed at every start by the static seal
    # (ADR-0028). `make up` initialises it once (scripts/init-store.sh) and keeps the root token in .env.
    image: openbao/openbao:2.7.1@sha256:6d2b93856e3fcf7b18ad855a0b51eaba474dc8b79cf554379ea32034797d2acf
    command: ["server"] # the image's entrypoint adds -config=/openbao/config
    environment:
      BAO_ADDR: http://127.0.0.1:8200
      OPENBAO_UNSEAL_KEY: ${OPENBAO_UNSEAL_KEY:?OPENBAO_UNSEAL_KEY is missing from infra/compose/.env; run make env}
    volumes:
      - ./openbao/openbao.hcl:/openbao/config/openbao.hcl:ro
      - openbao-data:/openbao/file
    ports:
      - "8200:8200"
    networks: [foundation]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.openbao.rule=Host(`openbao.localhost`)"
      - "traefik.http.routers.openbao.entrypoints=web,websecure"
      - "traefik.http.services.openbao.loadbalancer.server.port=8200"
    healthcheck:
      # `bao status` exits 0 unsealed, 2 sealed or not yet initialised, 1 when the server does not answer. Before the
      # first `make up` the store is uninitialised and that is healthy: init-store.sh needs it running to initialise it.
      test: ["CMD-SHELL", "bao status >/dev/null 2>&1; test $$? -ne 1"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    logging: *default-logging

  # ---------------------------------------------------------------- control plane (profile: control)
  # The control plane API and the fleet worker from the Foundation images (ADR-0022). On the laptop the two usually run
  # from source (make run-control, make run-fleet); the pipeline runs them this way. Each reads its own secret with its
  # own store token (ADR-0054): the API control/unit, the fleet fleet/unit, both written by the fleet's prepare-control,
  # which make secret-control and make up-control run, and the tokens put into .env by scripts/write-control-tokens.sh.
  control-api:
    image: ${IMAGE_REPOSITORY:-foundation}/iron-control-plane:${IMAGE_TAG:-dev}
    profiles: [control]
    environment: &control-environment
      ASPNETCORE_ENVIRONMENT: Production
      Tenant__Id: control
      # control-api is how units reach it on the platform network, for their audit anchors (ADR-0050).
      Tenant__HostnameList: control.localhost,localhost,control-api
      Secrets__Address: http://openbao:8200
      Secrets__Token: ${CONTROL_API_STORE_TOKEN:-} # the API's own token, which reads no secret of the fleet's
      Secrets__Path: control
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      # The operator's alerting, which the control plane sends every security alert to (ADR-0056).
      Monitoring__Alertmanager__Address: ${ALERTMANAGER_ADDRESS:-http://alertmanager:9093}
    ports:
      - "5200:8080" # the operator's address, the same as make run-control
    networks: [foundation]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.control.rule=Host(`control.localhost`)"
      - "traefik.http.routers.control.entrypoints=web,websecure"
      - "traefik.http.services.control.loadbalancer.server.port=8080"
    depends_on:
      postgres:
        condition: service_healthy
      openbao:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  fleet:
    image: ${IMAGE_REPOSITORY:-foundation}/iron-fleet:${IMAGE_TAG:-dev}
    profiles: [control]
    environment:
      <<: *control-environment
      Secrets__Token: ${FLEET_STORE_TOKEN:-} # the fleet's own token: the tenants' secrets, policies, tokens and keys
      Secrets__Path: fleet
      Fleet__Units__Runtime: compose
      Fleet__Units__ComposeDirectory: /var/lib/foundation/units
      Fleet__Units__IngressUrl: http://traefik
      Fleet__Units__ImageRepository: ${IMAGE_REPOSITORY:-foundation}
      Fleet__Units__ImageTag: ${IMAGE_TAG:-dev}
      Fleet__Units__PlatformNetwork: foundation
      Fleet__Units__OtlpEndpoint: http://otel-collector:4317
      Fleet__Database__UnitHost: postgres
      Fleet__Storage__UnitBlobEndpoint: http://blob:10000/${BLOB_ACCOUNT_NAME}
      Fleet__Secrets__UnitAddress: http://openbao:8200
      Fleet__PollSeconds: "3"
      Heartbeat__Interval: "00:01:00"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # the fleet drives the host's Docker (ADR-0019)
      - fleet-units:/var/lib/foundation/units
    networks: [foundation]
    depends_on:
      postgres:
        condition: service_healthy
      openbao:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  # ---------------------------------------------------------------- test identity provider (profile: sso)
  # An OpenID Connect provider for single sign-on's tests (S3 T4, ADR-0048): its login page takes the claims of each
  # sign-in (email, email_verified, name, groups, amr), so a test sets what it proves. Started by make smoke, make e2e and
  # the integration stage, never by make up. Reached at http://idp.localhost through the ingress; the issuer is
  # http://idp.localhost/<issuer id>, any first path segment being an issuer of its own.
  idp:
    image: ghcr.io/navikt/mock-oauth2-server:6.0.4@sha256:47374fe063995d9b6d39ebb6ea21eb5f765025bf0aa08b61b08b439eb91adaf0 # MIT
    profiles: [sso]
    environment:
      JSON_CONFIG: '{"interactiveLogin": true}'
      LOG_LEVEL: WARN
    networks: [foundation]
    deploy:
      resources:
        limits:
          memory: 300M # the budget of ADR-0048; measured at about 170 MB after twenty sign-ins
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.idp.rule=Host(`idp.localhost`)"
      - "traefik.http.routers.idp.entrypoints=web,websecure"
      - "traefik.http.services.idp.loadbalancer.server.port=8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/isalive"]
      interval: 5s
      timeout: 3s
      retries: 24
    restart: unless-stopped
    logging: *default-logging

  # ---------------------------------------------------------------- telemetry (profile: telemetry; collector and tempo also: ci)
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0@sha256:39923a8e431bd1f57be82411999d389fcfe40857492e4365456d97a4c1f74be6 # Apache-2.0
    profiles: [telemetry, ci]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./telemetry/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC, for applications started on the laptop with `dotnet run`
      - "4318:4318" # OTLP HTTP
    networks: [foundation]
    restart: unless-stopped
    logging: *default-logging

  tempo:
    image: grafana/tempo:3.1.0@sha256:3076b8dcdfb32fd6bc5ccef85e7b7313e6199b9cb84366257fc17ecb696db5fd # AGPL-3.0
    profiles: [telemetry, ci]
    command: ["-target=all", "-config.file=/etc/tempo.yaml"]
    volumes:
      - ./telemetry/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200" # Tempo API, also used by scripts/wait-ready.sh and by the smoke test (T17)
    networks: [foundation]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tempo.rule=Host(`tempo.localhost`)"
      - "traefik.http.routers.tempo.entrypoints=web,websecure"
      - "traefik.http.services.tempo.loadbalancer.server.port=3200"
    # Distroless image without a shell: no Compose health check is possible. `make up` waits for /ready instead.
    restart: unless-stopped
    logging: *default-logging

  loki:
    image: grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193 # AGPL-3.0
    profiles: [telemetry]
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./telemetry/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100" # Loki API, also used by scripts/wait-ready.sh
    networks: [foundation]
    # Distroless image without a shell: no Compose health check is possible. `make up` waits for /ready instead.
    restart: unless-stopped
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e # Apache-2.0
    profiles: [telemetry]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
      - --enable-feature=native-histograms
    volumes:
      - ./telemetry/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [foundation]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.localhost`)"
      - "traefik.http.routers.prometheus.entrypoints=web,websecure"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    logging: *default-logging

  # The operator's alerting (ADR-0056): the control plane posts every security alert to it; it pages nobody on the laptop.
  alertmanager:
    image: prom/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a # Apache-2.0
    profiles: [telemetry, ci]
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.external-url=http://alertmanager.localhost
    volumes:
      - ./telemetry/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "9093:9093" # Alertmanager API, also read by the smoke test's security-alerts step
    networks: [foundation]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.alertmanager.rule=Host(`alertmanager.localhost`)"
      - "traefik.http.routers.alertmanager.entrypoints=web,websecure"
      - "traefik.http.services.alertmanager.loadbalancer.server.port=9093"
    deploy:
      resources:
        limits:
          memory: 64M # the budget of ADR-0056; measured at about 20 MB holding the laptop's alerts
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9093/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    logging: *default-logging

  grafana:
    image: grafana/grafana:13.2.3@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572 # AGPL-3.0
    profiles: [telemetry]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SERVER_ROOT_URL: http://grafana.localhost
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./telemetry/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./telemetry/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks: [foundation]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.localhost`)"
      - "traefik.http.routers.grafana.entrypoints=web,websecure"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging
