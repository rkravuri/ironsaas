# Foundation laptop platform (ADR-0005).
# Start with `make up` (everything) or `make up-slim` (no telemetry stack); stop with `make down`.
# Credentials come from infra/compose/.env, created once by `make env`. No secret lives in this file.
# Image versions are exact (ADR-0003); the licence of each image is noted on its service.

name: foundation

networks:
  foundation:
    # Tenant units (T14) are separate Compose projects; they join this network as an external network.
    name: foundation

volumes:
  postgres-data:
  blob-data:
  prometheus-data:
  loki-data:
  fleet-units:
  tempo-data:
  grafana-data:

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  # ---------------------------------------------------------------- ingress
  traefik:
    image: traefik:v3.7.12 # MIT
    command: ["--configFile=/etc/traefik/traefik.yaml"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yaml:/etc/traefik/traefik.yaml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./certs:/certs:ro
    networks: [foundation]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.localhost`)"
      - "traefik.http.routers.traefik.entrypoints=web,websecure"
      - "traefik.http.routers.traefik.service=api@internal"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    logging: *default-logging

  # ---------------------------------------------------------------- database
  postgres:
    # PostgreSQL licence. 19 is a release candidate until the GA planned for 2026-11-19; change the tag to 19.0 then.
    image: postgres:19rc1
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - max_connections=300
      - -c
      - log_min_duration_statement=250
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 18 and later images keep the data under /var/lib/postgresql/<major>/docker; mount the parent.
      - postgres-data:/var/lib/postgresql
    networks: [foundation]
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *default-logging

  # ---------------------------------------------------------------- object storage
  blob:
    # MIT. Azurite, the local stand-in for Azure Blob Storage (ADR-0006). Blob service only.
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0
    command:
      - azurite-blob
      - --blobHost
      - "0.0.0.0"
      - --blobPort
      - "10000"
      - --location
      - /data
      - --skipApiVersionCheck
      - --loose
    environment:
      AZURITE_ACCOUNTS: ${BLOB_ACCOUNT_NAME}:${BLOB_ACCOUNT_KEY}
    ports:
      - "10000:10000"
    volumes:
      - blob-data:/data
    networks: [foundation]
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "10000"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    logging: *default-logging

  # ---------------------------------------------------------------- secrets
  openbao:
    # MPL-2.0. Development mode: in memory, unsealed, one root token. Data is lost when the container stops (see the runbook).
    image: openbao/openbao:2.7.1
    command:
      - server
      - -dev
      - -dev-root-token-id=${OPENBAO_ROOT_TOKEN}
      - -dev-listen-address=0.0.0.0:8200
    environment:
      BAO_ADDR: http://127.0.0.1:8200
    cap_add: [IPC_LOCK]
    ports:
      - "8200:8200"
    networks: [foundation]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.openbao.rule=Host(`openbao.localhost`)"
      - "traefik.http.routers.openbao.entrypoints=web,websecure"
      - "traefik.http.services.openbao.loadbalancer.server.port=8200"
    healthcheck:
      test: ["CMD", "bao", "status"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    logging: *default-logging

  # ---------------------------------------------------------------- control plane (profile: control)
  # The control plane API and the fleet worker from the Foundation images (ADR-0022). On the laptop the two usually run
  # from source (make run-control, make run-fleet); the pipeline runs them this way. Both read their configuration from
  # the control unit's secret, written by scripts/write-control-secret.sh with CONTROL_DB_HOST=postgres CONTROL_BLOB_HOST=blob.
  control-api:
    image: ${IMAGE_REPOSITORY:-foundation}/iron-control-plane:${IMAGE_TAG:-dev}
    profiles: [control]
    environment: &control-environment
      ASPNETCORE_ENVIRONMENT: Production
      Tenant__Id: control
      Tenant__HostnameList: control.localhost,localhost
      Secrets__Address: http://openbao:8200
      Secrets__Token: ${OPENBAO_ROOT_TOKEN}
      Secrets__Path: control
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "5200:8080" # the operator's address, the same as make run-control
    networks: [foundation]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.control.rule=Host(`control.localhost`)"
      - "traefik.http.routers.control.entrypoints=web,websecure"
      - "traefik.http.services.control.loadbalancer.server.port=8080"
    depends_on:
      postgres:
        condition: service_healthy
      openbao:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  fleet:
    image: ${IMAGE_REPOSITORY:-foundation}/iron-fleet:${IMAGE_TAG:-dev}
    profiles: [control]
    environment:
      <<: *control-environment
      Fleet__Units__Runtime: compose
      Fleet__Units__ComposeDirectory: /var/lib/foundation/units
      Fleet__Units__IngressUrl: http://traefik
      Fleet__Units__ImageRepository: ${IMAGE_REPOSITORY:-foundation}
      Fleet__Units__ImageTag: ${IMAGE_TAG:-dev}
      Fleet__Units__PlatformNetwork: foundation
      Fleet__Units__OtlpEndpoint: http://otel-collector:4317
      Fleet__Database__UnitHost: postgres
      Fleet__Storage__UnitBlobEndpoint: http://blob:10000/${BLOB_ACCOUNT_NAME}
      Fleet__Secrets__UnitAddress: http://openbao:8200
      Fleet__PollSeconds: "3"
      Heartbeat__Interval: "00:01:00"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # the fleet drives the host's Docker (ADR-0019)
      - fleet-units:/var/lib/foundation/units
    networks: [foundation]
    depends_on:
      postgres:
        condition: service_healthy
      openbao:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  # ---------------------------------------------------------------- telemetry (profile: telemetry; collector and tempo also: ci)
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0 # Apache-2.0
    profiles: [telemetry, ci]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./telemetry/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC, for applications started on the laptop with `dotnet run`
      - "4318:4318" # OTLP HTTP
    networks: [foundation]
    restart: unless-stopped
    logging: *default-logging

  tempo:
    image: grafana/tempo:3.1.0 # AGPL-3.0
    profiles: [telemetry, ci]
    command: ["-target=all", "-config.file=/etc/tempo.yaml"]
    volumes:
      - ./telemetry/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200" # Tempo API, also used by scripts/wait-ready.sh and by the smoke test (T17)
    networks: [foundation]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tempo.rule=Host(`tempo.localhost`)"
      - "traefik.http.routers.tempo.entrypoints=web,websecure"
      - "traefik.http.services.tempo.loadbalancer.server.port=3200"
    # Distroless image without a shell: no Compose health check is possible. `make up` waits for /ready instead.
    restart: unless-stopped
    logging: *default-logging

  loki:
    image: grafana/loki:3.7.8 # AGPL-3.0
    profiles: [telemetry]
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./telemetry/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100" # Loki API, also used by scripts/wait-ready.sh
    networks: [foundation]
    # Distroless image without a shell: no Compose health check is possible. `make up` waits for /ready instead.
    restart: unless-stopped
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v3.15.0 # Apache-2.0
    profiles: [telemetry]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
      - --enable-feature=native-histograms
    volumes:
      - ./telemetry/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [foundation]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.localhost`)"
      - "traefik.http.routers.prometheus.entrypoints=web,websecure"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    logging: *default-logging

  grafana:
    image: grafana/grafana:13.2.3 # AGPL-3.0
    profiles: [telemetry]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SERVER_ROOT_URL: http://grafana.localhost
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./telemetry/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./telemetry/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks: [foundation]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.localhost`)"
      - "traefik.http.routers.grafana.entrypoints=web,websecure"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging
