# Prometheus scrape targets for the laptop.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: applications
    # Metrics the applications send over OTLP, re-exposed by the collector.
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: traefik
    static_configs:
      - targets: ["traefik:8082"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
