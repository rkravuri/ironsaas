# The findings the security gate lets through for a time (TF-076 AC2, ADR-0055). Keep this list short.
#
# Each exception names the finding (a CVE or GHSA id, a misconfiguration's id, a rule's id, or a licence), the package
# it is in (the package's name, or the file for a misconfiguration or a rule finding; * matches any characters), the
# reason it may wait, who approved it, the date they approved it and the date it expires, at most six months later.
# tools/security_gate.py applies it to every scanner's report. From its expiry the finding fails the build again, and so
# does the expired entry itself, until it is renewed with a new approval or removed once the finding is gone.
#
# A false positive in the repository's own code is not an exception: it is suppressed at its line with its reason
# (a pragma for the .NET analyzers, nosemgrep for the rules), which the pull request's review reads like code.
# docs/security/exceptions.md keeps the process exceptions, which no scanner reports.
exceptions:
  - finding: DS-0002
    package: src/Hosts/Iron.Host.Fleet/Dockerfile
    reason: >-
      The fleet drives Docker through the socket mounted into its container on the laptop and the runner (ADR-0019),
      which needs root. The other images run as a non-root user. On Kubernetes (S6) the fleet uses no socket, and this
      exception ends with it.
    approver: Product owner and architect (ADR-0019, carried from .trivyignore.yaml in S3 T10a)
    approved: 2026-10-28
    expires: 2027-04-27
