# One tenant unit (ADR-0002, ADR-0019, ADR-0020): the API, the worker and the shell of one tenant, from the same images as every other tenant,
# with the limits of the tenant's size class. The fleet renders only the .env file next to this file; the file itself is
# the same for every tenant. Platform services (postgres, blob, openbao, otel-collector, traefik) are reached on the
# platform network; the unit has a network of its own for anything tenant-local later.
name: tenant-${TENANT}

services:
  api:
    image: ${IMAGE_REPOSITORY}/iron-api:${IMAGE_TAG}
    environment: &unit-environment
      ASPNETCORE_ENVIRONMENT: Production
      Tenant__Id: ${TENANT}
      Tenant__HostnameList: ${HOSTNAMES}
      Secrets__Address: ${SECRETS_ADDRESS}
      Secrets__Token: ${SECRETS_TOKEN}
      Secrets__Mount: ${SECRETS_MOUNT}
      Secrets__Path: ${SECRETS_PATH}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTLP_ENDPOINT}
      # The tenant's suites (TF-244, ADR-0059): the unit loads the Foundation and these, and nothing of another suite.
      Suites__Installed: ${SUITES}
    networks: [platform, unit]
    deploy:
      resources:
        limits:
          cpus: "${API_CPUS}"
          memory: ${API_MEMORY_MB}M
    labels:
      # The API answers its own paths; everything else on the tenant's hostnames is the shell (ADR-0020).
      - "traefik.enable=true"
      - "traefik.docker.network=${PLATFORM_NETWORK}"
      - "traefik.http.routers.tenant-${TENANT}-api.rule=(${HOST_RULE}) && (PathPrefix(`/api`) || PathPrefix(`/auth`) || PathPrefix(`/connect`) || PathPrefix(`/health`) || PathPrefix(`/.well-known`))"
      - "traefik.http.routers.tenant-${TENANT}-api.priority=20"
      - "traefik.http.routers.tenant-${TENANT}-api.entrypoints=web,websecure"
      - "traefik.http.routers.tenant-${TENANT}-api.service=tenant-${TENANT}-api"
      - "traefik.http.services.tenant-${TENANT}-api.loadbalancer.server.port=8080"
    restart: unless-stopped

  shell:
    image: ${IMAGE_REPOSITORY}/iron-shell:${IMAGE_TAG}
    networks: [platform]
    deploy:
      resources:
        limits:
          cpus: "${SHELL_CPUS}"
          memory: ${SHELL_MEMORY_MB}M
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${PLATFORM_NETWORK}"
      - "traefik.http.routers.tenant-${TENANT}-shell.rule=${HOST_RULE}"
      - "traefik.http.routers.tenant-${TENANT}-shell.priority=10"
      - "traefik.http.routers.tenant-${TENANT}-shell.entrypoints=web,websecure"
      - "traefik.http.routers.tenant-${TENANT}-shell.service=tenant-${TENANT}-shell"
      - "traefik.http.services.tenant-${TENANT}-shell.loadbalancer.server.port=8080"
    restart: unless-stopped

  worker:
    image: ${IMAGE_REPOSITORY}/iron-worker:${IMAGE_TAG}
    environment: *unit-environment
    networks: [platform, unit]
    deploy:
      resources:
        limits:
          cpus: "${WORKER_CPUS}"
          memory: ${WORKER_MEMORY_MB}M
    restart: unless-stopped

networks:
  platform:
    external: true
    name: ${PLATFORM_NETWORK}
  unit:
    name: tenant-${TENANT}
