name: CI

# Main changes only through a pull request whose every check is green (ADR-0055). Each pull request runs this workflow
# in full (ADR-0022): the code builds with warnings as errors and every .NET security rule, the architecture and
# integration tests pass on the run's PostgreSQL, Azurite and OpenBao with the product's line coverage above its floor,
# the shell lints with its security rules, is formatted (ADR-0040), type-checks, tests above its coverage floor and
# builds, its gallery passes the accessibility scan, the requirement documents keep their identifiers and tables
# (ADR-0041), the dependencies, their licences, the misconfigurations and the code pass the security gate, no secret is
# in the history, and the traceability matrix is published (TF-218, ADR-0044).
#
# After the merge, a push to main runs only "Merge commit builds": the pull request's run already tested the same tree,
# since the branch must be up to date with main before it merges. A change of documents only (docs/ and markdown files,
# the threat models excepted, which a test reads) skips the build, test and scan jobs; the requirement documents, the
# secret scan and the trace still run. A newer push cancels the older run of the same pull request or branch. The
# release (release.yml) runs nightly and on demand, from these runs' results. workflow_dispatch runs CI in full on any
# branch, which the release asks for when no full run covers main's tree.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.changes.outputs.code }}
      full: ${{ steps.changes.outputs.full }}
    steps:
      - name: Check out with history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # full: the whole workflow runs (a pull request, or a run asked for by hand); a push to main runs the merge build.
      # code: something other than documents changed. A push without a known parent counts as code.
      - name: Compare with the base
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          full=true
          [ "$EVENT" = push ] && full=false
          code=true
          if [ "$EVENT" != workflow_dispatch ] && [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            git diff --name-only "$BASE" "$GITHUB_SHA" > changed.txt
            echo "Changed files:"; cat changed.txt
            if ! grep -vE '^docs/|\.md$' changed.txt | grep -q . && ! grep -q '^docs/security/threat-models/' changed.txt; then
              code=false
            fi
          fi
          echo "full=$full code=$code"
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  dotnet:
    name: .NET build and tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.full == 'true' && needs.changes.outputs.code == 'true'
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: nuget-

      # The dependency scan's own test runs Trivy (DependencyScanTests), whose database changes daily.
      - name: Date of the scanners' database
        id: today
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache Trivy's database
        uses: actions/cache@v6
        with:
          path: ~/.cache/trivy
          key: trivy-${{ steps.today.outputs.day }}
          restore-keys: trivy-

      # Locked: a lock file that does not match its project fails here (ADR-0055).
      - name: Restore
        run: dotnet restore Foundation.slnx

      - name: Build (warnings are errors, every security rule on)
        run: dotnet build Foundation.slnx --configuration Release --no-restore

      - name: Format check
        run: dotnet format Foundation.slnx --verify-no-changes --no-restore

      # Architecture, unit and integration tests; the integration tests use PostgreSQL, Azurite and OpenBao, as
      # the run's one container of each on the runner's Docker, four test projects at a time, as on the laptop
      # (tests/test-services.sh; Microsoft Testing Platform mode, the solution passed with --solution), with line
      # coverage of the product's code (TF-077 AC4).
      - name: Test
        run: make test CONFIG=Release COVERAGE=1 TEST_ARGS=--no-build

      # The floors of the branch this change goes into, so a floor that falls is refused too (ADR-0055).
      - name: The base branch's coverage floors
        if: github.event_name == 'pull_request'
        run: git fetch --depth=1 origin "${{ github.base_ref }}" && git show "origin/${{ github.base_ref }}:security/coverage.yaml" > base-coverage.yaml || true

      - name: Coverage floor
        run: make coverage AREA=dotnet BASE_FLOORS=base-coverage.yaml

      # The TRX files for the traceability matrix (ADR-0044) and the coverage, whatever the result.
      - name: Upload the test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-dotnet
          path: artifacts/test-results
          if-no-files-found: ignore
          retention-days: 7

  shell:
    name: Shell lint, tests and build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.full == 'true' && needs.changes.outputs.code == 'true'
    defaults:
      run:
        working-directory: shell
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: shell/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      # npm run check: lint with the security rules, Prettier's check (ADR-0040), the type check, the tests with line
      # coverage, and the build.
      - name: Lint, format check, type check, tests and build
        run: npm run check

      - name: The base branch's coverage floors
        if: github.event_name == 'pull_request'
        working-directory: .
        run: git fetch --depth=1 origin "${{ github.base_ref }}" && git show "origin/${{ github.base_ref }}:security/coverage.yaml" > base-coverage.yaml || true

      - name: Coverage floor
        working-directory: .
        run: make coverage AREA=shell BASE_FLOORS=base-coverage.yaml

      # Vitest's JUnit file for the traceability matrix (ADR-0044) and the coverage, whatever the result.
      - name: Upload the test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-shell
          path: artifacts/test-results
          if-no-files-found: ignore
          retention-days: 7

  shell-accessibility:
    name: Shell accessibility scan
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.full == 'true' && needs.changes.outputs.code == 'true'
    defaults:
      run:
        working-directory: shell
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: shell/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      # The browser is kept by the Playwright version the lock file pins; the system libraries it needs are installed
      # each time, as they live outside the cache.
      - name: Cache the Playwright browsers
        id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('shell/package-lock.json') }}

      - name: Install Chromium
        run: |
          if [ "${{ steps.browsers.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      # The gallery build (development mode, so the route exists), vite preview, then axe in both schemes and densities.
      - name: Build the gallery and scan it
        run: npm run a11y

      # The screenshots (test-results/a11y) and the report on every run: the review looks at the pictures, not only at failures.
      - name: Upload the screenshots and the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shell-accessibility
          path: |
            shell/test-results
            shell/playwright-report
          if-no-files-found: ignore
          retention-days: 7

      # The scan's JUnit file for the traceability matrix (ADR-0044), whatever the result.
      - name: Upload the test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-a11y
          path: artifacts/test-results
          if-no-files-found: ignore
          retention-days: 7

  platform-config:
    name: Compose files
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.full == 'true' && needs.changes.outputs.code == 'true'
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # Validates infra/compose/compose.yaml with every profile and throw-away credentials.
      - name: Validate the platform compose file
        run: |
          sh infra/compose/scripts/init-env.sh
          docker compose --file infra/compose/compose.yaml --env-file infra/compose/.env \
            --profile telemetry --profile ci --profile control config --quiet

  # The requirement documents run on every change, documents only included (ADR-0041).
  documents:
    name: Requirement documents
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.full == 'true'
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # The packs' BPMN maps are checked against OMG's schema by a .NET tool (ADR-0045).
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: nuget-

      # The requirement documents (ADR-0041): identifiers, the map from the archived PRD, the criteria, the product
      # PRDs' sections and every CSV against its markdown, with Python 3 and its standard library as the runner has
      # them; then the process reference packs' BPMN maps against the BPMN 2.0 schema (ADR-0045).
      - name: Check the requirement documents
        run: make prd-check

      # The check's own tests' JUnit file for the traceability matrix (ADR-0044), whatever the result.
      - name: Upload the test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-python
          path: artifacts/test-results
          if-no-files-found: ignore
          retention-days: 7

  # The dependencies with their transitive ones and their licences, the misconfigurations and the repository's own
  # rules, then the gate (TF-076, ADR-0055), as make security runs them on the laptop.
  security:
    name: Security scans
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.full == 'true' && needs.changes.outputs.code == 'true'
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET SDK (the restore fills the NuGet cache Trivy reads licences from)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: nuget-

      - name: Date of the scanners' database
        id: today
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache Trivy's database
        uses: actions/cache@v6
        with:
          path: ~/.cache/trivy
          key: trivy-${{ steps.today.outputs.day }}
          restore-keys: trivy-

      - name: Dependencies, licences, misconfigurations and the code's rules
        run: make security

      - name: Upload the scans' reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-scans
          path: artifacts/security
          if-no-files-found: ignore
          retention-days: 30

  # The matrix from the other jobs' result files: every requirement criterion and decision with the tests that prove it
  # and their results, and the criteria of the done slices without a test (make trace, ADR-0044). It runs whatever the
  # others did, so a failing run still shows what failed against what it proves; the browser tests and the smoke need
  # the stack and show as not run here, and the release workflow adds the smoke's results. On a change of documents
  # only it runs on their results alone.
  trace:
    name: Traceability matrix
    runs-on: ubuntu-latest
    needs: [changes, dotnet, shell, shell-accessibility, documents]
    if: always() && needs.changes.result == 'success' && needs.changes.outputs.full == 'true'
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # Retried: a lost connection while downloading once failed this job (run 39912627606).
      - name: Download the test results
        uses: ./.github/actions/download-artifacts
        with:
          pattern: test-results-*
          merge-multiple: "true"
          path: artifacts/test-results

      - name: Build the matrix
        run: make trace

      - name: Upload the matrix
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: traceability-matrix
          path: artifacts/trace
          if-no-files-found: ignore
          retention-days: 30

  # On every change, documents only included: a document can hold a secret as easily as code (ADR-0055).
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.full == 'true'
    # On a pull request, gitleaks-action lists the pull request's commits through the API, which needs pull-requests:
    # read; with the workflow's contents: read alone every pull request's scan failed with 403 "Resource not accessible
    # by integration" (Dependabot's were the first pull requests to run CI). Reading is all it gets; the scan is the
    # same for everyone.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out with history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The gitleaks version is pinned (ADR-0003), the same image tests/Iron.Architecture.Tests/SecretScanTests.cs runs
      # on a fixture to prove a secret fails the scan naming its file and its type (TF-073 AC1, ADR-0054).
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"

  # After the merge: the merge commit builds. Its tree is the one the pull request's run tested.
  merge-build:
    name: Merge commit builds
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.full == 'false' && needs.changes.outputs.code == 'true'
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: nuget-

      - name: Build the .NET solution
        run: dotnet build Foundation.slnx --configuration Release

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: shell/package-lock.json

      - name: Build the shell
        working-directory: shell
        run: |
          npm ci --no-audit --no-fund
          npm run build
