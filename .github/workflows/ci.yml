name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Foundation.slnx

      - name: Build (warnings are errors)
        run: dotnet build Foundation.slnx --configuration Release --no-restore

      # Microsoft Testing Platform mode (global.json): the solution is passed with --solution.
      - name: Test
        run: dotnet test --solution Foundation.slnx --configuration Release --no-build

  platform-config:
    name: Platform compose file
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # Validates infra/compose/compose.yaml and its variable references with throw-away credentials.
      # Starting the platform in CI comes with T18.
      - name: Validate the compose file
        run: |
          sh infra/compose/scripts/init-env.sh
          docker compose --file infra/compose/compose.yaml --env-file infra/compose/.env \
            --profile telemetry --profile ci config --quiet
