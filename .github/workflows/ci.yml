name: CI

# Every pull request and every push to main (ADR-0022): the code builds with warnings as errors, the architecture and
# integration tests pass against Testcontainers, the shell lints, type-checks, tests and builds, no secret is in the
# history, and no known critical or high vulnerability is in the dependencies.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  dotnet:
    name: .NET build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Foundation.slnx

      - name: Build (warnings are errors)
        run: dotnet build Foundation.slnx --configuration Release --no-restore

      - name: Format check
        run: dotnet format Foundation.slnx --verify-no-changes --no-restore

      # Architecture, unit and integration tests; the integration tests start PostgreSQL, Azurite and OpenBao with
      # Testcontainers on the runner's Docker. Microsoft Testing Platform mode: the solution is passed with --solution.
      - name: Test
        run: dotnet test --solution Foundation.slnx --configuration Release --no-build

  shell:
    name: Shell lint, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shell
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: shell/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Lint, type check, tests and build
        run: npm run check

  platform-config:
    name: Compose files
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # Validates infra/compose/compose.yaml with every profile and throw-away credentials.
      - name: Validate the platform compose file
        run: |
          sh infra/compose/scripts/init-env.sh
          docker compose --file infra/compose/compose.yaml --env-file infra/compose/.env \
            --profile telemetry --profile ci --profile control config --quiet

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Check out with history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  vulnerabilities:
    name: Dependency scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # Lock files of the .NET and the shell dependencies; images are scanned in the release workflow.
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
