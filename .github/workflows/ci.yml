name: CI

# Every pull request and every push to main (ADR-0022): the code builds with warnings as errors, the architecture and
# integration tests pass on the run's PostgreSQL, Azurite and OpenBao, the shell lints, is formatted (ADR-0040),
# type-checks, tests and builds, its gallery passes the
# accessibility scan, no secret is in the history, no known critical or high vulnerability is in the dependencies, and
# the requirement documents keep their identifiers, their map and their tables (ADR-0041). Every run publishes the
# traceability matrix: each test with what it proves and its result (TF-218, ADR-0044).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  dotnet:
    name: .NET build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Foundation.slnx

      - name: Build (warnings are errors)
        run: dotnet build Foundation.slnx --configuration Release --no-restore

      - name: Format check
        run: dotnet format Foundation.slnx --verify-no-changes --no-restore

      # Architecture, unit and integration tests; the integration tests use PostgreSQL, Azurite and OpenBao, as
      # the run's one container of each on the runner's Docker, four test projects at a time, as on the laptop
      # (tests/test-services.sh; Microsoft Testing Platform mode, the solution passed with --solution).
      - name: Test
        run: make test CONFIG=Release TEST_ARGS=--no-build

      # The TRX files for the traceability matrix (ADR-0044), whatever the result.
      - name: Upload the test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-dotnet
          path: artifacts/test-results
          if-no-files-found: ignore
          retention-days: 7

  shell:
    name: Shell lint, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shell
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: shell/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      # npm run check: lint, Prettier's check (ADR-0040), the type check, the tests and the build.
      - name: Lint, format check, type check, tests and build
        run: npm run check

      # Vitest's JUnit file for the traceability matrix (ADR-0044), whatever the result.
      - name: Upload the test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-shell
          path: artifacts/test-results
          if-no-files-found: ignore
          retention-days: 7

  shell-accessibility:
    name: Shell accessibility scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shell
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: shell/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The gallery build (development mode, so the route exists), vite preview, then axe in both schemes and densities.
      - name: Build the gallery and scan it
        run: npm run a11y

      # The screenshots (test-results/a11y) and the report on every run: the review looks at the pictures, not only at failures.
      - name: Upload the screenshots and the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shell-accessibility
          path: |
            shell/test-results
            shell/playwright-report
          if-no-files-found: ignore
          retention-days: 7

      # The scan's JUnit file for the traceability matrix (ADR-0044), whatever the result.
      - name: Upload the test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-a11y
          path: artifacts/test-results
          if-no-files-found: ignore
          retention-days: 7

  platform-config:
    name: Compose files
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # Validates infra/compose/compose.yaml with every profile and throw-away credentials.
      - name: Validate the platform compose file
        run: |
          sh infra/compose/scripts/init-env.sh
          docker compose --file infra/compose/compose.yaml --env-file infra/compose/.env \
            --profile telemetry --profile ci --profile control config --quiet

      # The packs' BPMN maps are checked against OMG's schema by a .NET tool (ADR-0045).
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # The requirement documents (ADR-0041): identifiers, the map from the archived PRD, the criteria, the product
      # PRDs' sections and every CSV against its markdown, with Python 3 and its standard library as the runner has
      # them; then the process reference packs' BPMN maps against the BPMN 2.0 schema (ADR-0045).
      - name: Check the requirement documents
        run: make prd-check

      # The check's own tests' JUnit file for the traceability matrix (ADR-0044), whatever the result.
      - name: Upload the test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-python
          path: artifacts/test-results
          if-no-files-found: ignore
          retention-days: 7

  # The matrix from the other jobs' result files: every requirement criterion and decision with the tests that prove it
  # and their results, and the criteria of the done slices without a test (make trace, ADR-0044). It runs whatever the
  # others did, so a failing run still shows what failed against what it proves; the browser tests and the smoke need
  # the stack and show as not run here, and the release workflow adds the smoke's results.
  trace:
    name: Traceability matrix
    runs-on: ubuntu-latest
    needs: [dotnet, shell, shell-accessibility, platform-config]
    if: always()
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Download the test results
        uses: actions/download-artifact@v7
        with:
          pattern: test-results-*
          merge-multiple: true
          path: artifacts/test-results

      - name: Build the matrix
        run: make trace

      - name: Upload the matrix
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: traceability-matrix
          path: artifacts/trace
          if-no-files-found: ignore
          retention-days: 30

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    # On a pull request, gitleaks-action lists the pull request's commits through the API, which needs pull-requests:
    # read; with the workflow's contents: read alone every pull request's scan failed with 403 "Resource not accessible
    # by integration" (Dependabot's were the first pull requests to run CI). Reading is all it gets; the scan is the
    # same for everyone.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out with history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  vulnerabilities:
    name: Dependency scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # Lock files of the .NET and the shell dependencies; images are scanned in the release workflow.
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          # The exceptions, each with its reason.
          trivyignores: .trivyignore.yaml
