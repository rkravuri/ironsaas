# Version updates for everything the build pins (ADR-0003, ADR-0022): the actions, the .NET packages, the shell's
# packages and the base images. One pull request per ecosystem per week; CI tells whether the bump is safe.
# A version must be at least two weeks old before it is proposed (ADR-0003), and a major version comes on its own, out
# of the groups, since it usually needs work of its own. Its pull requests pass the same checks as a task's and merge the
# same way; the fix times of a finding are the dependency policy's, in docs/security/README.md (ADR-0055). The NuGet
# updates rewrite each project's packages.lock.json with the version.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      dotnet:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Roslyn moves with EF Core, by hand. Microsoft.EntityFrameworkCore.Design pulls Microsoft.CodeAnalysis.CSharp.Workspaces
      # at its own Roslyn version, which needs the same Microsoft.CodeAnalysis.Common as Microsoft.CodeAnalysis.CSharp:
      # 5.9.0 beside EF Core 10.0.12's 5.0.0 does not restore (NU1107, #12). Raise it with the EF Core that asks for it.
      - dependency-name: "Microsoft.CodeAnalysis.CSharp"
  - package-ecosystem: npm
    directory: /shell
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      shell:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # TypeScript majors wait for typescript-eslint, which asks for typescript below 6.1 (8.72.0 on 2026-10-19), so
      # TypeScript 7 does not resolve and failed the npm job. Remove this when typescript-eslint accepts the major.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directories:
      - /src/Hosts/Iron.Host.Api
      - /src/Hosts/Iron.Host.Worker
      - /src/Hosts/Iron.Host.ControlPlane
      - /src/Hosts/Iron.Host.Fleet
      - /shell
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
