# The security headers of TF-070 for every response of the shell (ADR-0053), included in each location of nginx.conf:
# nginx drops the headers of an outer level wherever a location adds one of its own, so each location includes these.
# No inline script or style is allowed. The style elements the shell's libraries make (Mantine, AG Grid) carry this
# response's nonce, which nginx also writes into index.html in place of CSP_NONCE; it is new for every response.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; object-src 'none'; img-src 'self' data:; font-src 'self' data:; style-src 'self' 'nonce-$request_id' 'report-sample'; script-src 'self' 'report-sample'; worker-src 'self'; connect-src 'self'; report-uri /api/v1/csp-reports; report-to csp" always;
add_header Reporting-Endpoints 'csp="/api/v1/csp-reports"' always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
