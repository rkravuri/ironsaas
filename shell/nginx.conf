# The shell behind the ingress: static files, the single-page fallback for the shell's own routes, the security headers of
# TF-070 on every response (security-headers.conf), long caching for hashed assets and none for index.html. The ingress
# sends the API's paths to the unit's API (ADR-0020); when they reach here anyway, with no API behind, they answer 404, not
# the shell's page, and so does a file that is not here (ADR-0053).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # The style nonce of this response, written into the page wherever Vite left the placeholder.
    sub_filter_once off;
    sub_filter_types text/html;
    sub_filter "CSP_NONCE" "$request_id";

    location = /healthz {
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The API's, the sign-in's and the health paths: never the shell's page.
    location ~ ^/(api|auth|connect|health|\.well-known)(/|$) {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        default_type application/problem+json;
        return 404 '{"status":404,"title":"Not found.","detail":"This path belongs to the API, which does not answer here."}';
    }

    location ^~ /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # A path that names a file (it has an extension) is the file or 404, never the shell's page.
    location ~ \.[A-Za-z0-9]+$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # The shell's own routes: the single-page fallback.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri /index.html;
    }
}
